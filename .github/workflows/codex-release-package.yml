name: Codex Release Package

on:
  push:
    branches:
      - release/codex-plugin-3.7.0
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Align release-coupled version references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          result = subprocess.run(
              ["git", "grep", "-Il", "3.6.0"],
              check=False,
              capture_output=True,
              text=True,
          )
          for name in result.stdout.splitlines():
              if name.startswith("demos/") or name.startswith(".github/workflows/"):
                  continue
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("3.6.0", "3.7.0"), encoding="utf-8")
          PY
          if git grep -I -n '3\.6\.0' -- ':!demos/**' ':!.github/workflows/**'; then
            echo 'Unaligned 3.6.0 release reference remains outside excluded paths' >&2
            exit 1
          fi

      - name: Commit aligned release references
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/codex-plugin-3.7.0'
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "release: align version references for 3.7.0"
            git push origin HEAD:release/codex-plugin-3.7.0
          else
            echo 'Release references already aligned.'
          fi

      - name: Validate release metadata and focused contracts
        run: |
          python3 scripts/validate_codex_plugin.py
          python3 scripts/validate_antigravity_plugin.py
          python3 -m unittest -v \
            tests.test_codex_plugin \
            tests.test_openai_submission \
            tests.test_design_quality_upgrade \
            tests.test_public_plugin_installability

      - name: Build deterministic Codex ZIP twice
        run: |
          mkdir -p dist
          python3 scripts/package_codex_release.py dist/linkedin-animated-infographics-codex-plugin-v3.7.0-a.zip --json
          python3 scripts/package_codex_release.py dist/linkedin-animated-infographics-codex-plugin-v3.7.0-b.zip --json
          cmp dist/linkedin-animated-infographics-codex-plugin-v3.7.0-a.zip dist/linkedin-animated-infographics-codex-plugin-v3.7.0-b.zip
          mv dist/linkedin-animated-infographics-codex-plugin-v3.7.0-a.zip dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip
          rm dist/linkedin-animated-infographics-codex-plugin-v3.7.0-b.zip

      - name: Inspect archive boundary
        run: |
          unzip -Z1 dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip | tee dist/archive-members.txt
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archive = Path('dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip')
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              manifest = json.loads(zf.read('.codex-plugin/plugin.json'))

          assert '.codex-plugin/plugin.json' in names
          assert manifest['skills'] == './skills/'
          assert any(name.startswith('skills/') for name in names)
          assert not any(name.startswith('openai-skills/') for name in names)
          assert 'skills/host-workspace-operator/SKILL.md' in names
          assert 'skills/sandbox-python-executor/SKILL.md' in names
          assert 'assets/logo-light.svg' in names
          assert 'assets/logo-dark.svg' in names
          assert 'assets/plugin-icon.svg' in names
          assert not any(name == 'demos' or name.startswith('demos/') for name in names)
          assert not any(name.startswith('tests/') for name in names)
          assert not any(name.startswith('.github/') for name in names)
          assert not any(name.startswith('agents/') for name in names)
          assert not any(name.startswith('assets/') and name.lower().endswith(('.html', '.gif')) for name in names)

          skill_dirs = sorted({name.split('/', 2)[1] for name in names if name.startswith('skills/')})
          assert skill_dirs
          for slug in skill_dirs:
              assert f'skills/{slug}/SKILL.md' in names, slug

          print(f'Archive boundary OK: {len(names)} members; canonical skills/ root; internal/demo media excluded')
          PY
          sha256sum dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip | tee dist/SHA256SUMS.txt

      - name: Upload Codex release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linkedin-animated-infographics-codex-plugin-v3.7.0
          path: |
            dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip
            dist/SHA256SUMS.txt
            dist/archive-members.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v3.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.7.0 >/dev/null 2>&1; then
            gh release upload v3.7.0 \
              dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create v3.7.0 \
              dist/linkedin-animated-infographics-codex-plugin-v3.7.0.zip \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "v3.7.0" \
              --notes-file docs/releases/3.7.0.md
          fi
