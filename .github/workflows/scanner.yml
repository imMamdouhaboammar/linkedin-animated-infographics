name: Plugin Scanner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan:
    name: HOL AI Plugin Scanner
    runs-on: ubuntu-24.04
    # Normal scans finish in under a minute; bound a hung third-party action.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@1fb7eef6f7387abd0512e91ee8f336ac8bf07c95 # v1.2.789
        with:
          path: '.'
          min-score: 80
          fail-on-severity: 'high'
