name: Plugin Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node for host validators
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python runtime dependencies
        run: python3 -m pip install Pillow playwright

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python tools
        run: python3 -m compileall -q scripts tools skills/svg-mascot-animator/scripts

      - name: Validate Info-stories registry
        run: python3 scripts/info_stories.py check

      - name: Validate reference cache contract
        run: python3 scripts/reference_intelligence.py check

      - name: Validate ecosystem router
        run: python3 scripts/ecosystem_router.py check

      - name: Validate research gates
        run: python3 scripts/research_gates.py check

      - name: Validate executable plugin graph
        run: python3 scripts/plugin_graph.py check

      - name: Run strict ecosystem doctor
        run: python3 scripts/ecosystem_doctor.py check

      - name: Validate demo gallery
        run: python3 scripts/demo_gallery.py check

      - name: Validate Claude marketplace contract
        run: python3 scripts/validate_marketplace.py

      - name: Validate Codex and OpenAI plugin contract
        run: python3 scripts/validate_codex_plugin.py

      - name: Validate hook, JSON, and shell syntax
        run: |
          python3 -m json.tool hooks/hooks.json >/dev/null
          python3 -m json.tool helper/router.json >/dev/null
          python3 -m json.tool helper/capabilities.json >/dev/null
          python3 -m json.tool helper/artifacts.json >/dev/null
          python3 -m json.tool helper/quality-gates.json >/dev/null
          python3 -m json.tool helper/modules.json >/dev/null
          python3 -m json.tool research/capability-notes/gates.json >/dev/null
          python3 -m json.tool schemas/demo.schema.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool compatibility/codex.json >/dev/null
          python3 -m json.tool submission/openai-plugin.json >/dev/null
          python3 -m json.tool submission/test-cases.json >/dev/null
          bash -n scripts/lint_artboard.sh
          bash -n scripts/setup.sh

      - name: Whitespace integrity
        run: git diff --check HEAD^ HEAD

      - name: Install current Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run official Claude plugin validator
        run: claude plugin validate .

      - name: Smoke-test Claude marketplace registration and install
        run: |
          export HOME="${RUNNER_TEMP}/claude-marketplace-smoke"
          mkdir -p "$HOME"
          claude plugin marketplace add ./ --scope user
          claude plugin marketplace list --json > "${RUNNER_TEMP}/marketplaces.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("marketplaces.json").read_text())
          text = json.dumps(data)
          assert "mamdouh-creative-tools" in text, data
          PY
          claude plugin install linkedin-animated-infographics@mamdouh-creative-tools
