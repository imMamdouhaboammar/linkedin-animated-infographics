name: Runtime TDD Gate

on:
  push:
    branches:
      - feat/token-efficient-runtime-kernel

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run runtime efficiency contract tests
        run: python3 -m unittest -v tests.test_runtime_efficiency
