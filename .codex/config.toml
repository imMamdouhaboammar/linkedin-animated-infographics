#:schema https://developers.openai.com/codex/config-schema.json

# Repository-development Codex baseline. This file is not required by the installed plugin.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--extension"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6"
default_subagent_reasoning_effort = "high"

[agents.creative_director]
description = "Adapter for canonical agents/creative-director.md; compare evidence-safe directions and return to the parent."
config_file = "agents/creative_director.toml"

[agents.evidence_researcher]
description = "Adapter for canonical agents/evidence-checker.md; finalize evidence before creative work."
config_file = "agents/evidence_researcher.toml"

[agents.copy_director]
description = "Adapter for canonical agents/copy-compressor.md; compress approved copy without changing evidence."
config_file = "agents/copy_director.toml"

[agents.layout_composer]
description = "Adapter for canonical agents/layout-composer.md; materialize only the assigned layout artifacts."
config_file = "agents/layout_composer.toml"

[agents.still_critic]
description = "Adapter for canonical agents/post-critic.md; run the blocking pre-motion still critique."
config_file = "agents/still_critic.toml"

[agents.motion_director]
description = "Adapter for canonical agents/motion-director.md; execute motion direction only after still PASS."
config_file = "agents/motion_director.toml"

[agents.render_qa]
description = "Adapter for canonical agents/render-qa.md; review actual rendered evidence and return to the parent."
config_file = "agents/render_qa.toml"

[agents.final_verifier]
description = "Adapter for canonical agents/story-verifier.md; independently verify the canonical acceptance criteria."
config_file = "agents/final_verifier.toml"

[agents.tool_runner]
description = "Bounded execution adapter for a canonical worker contract explicitly supplied by the parent."
config_file = "agents/tool_runner.toml"

[agents.artboard_builder]
description = "Adapter for canonical agents/artboard-builder.md; build static HTML/SVG artboard matching approved assets and type."
config_file = "agents/artboard_builder.toml"

[agents.asset_curator]
description = "Adapter for canonical agents/asset-curator.md; resolve Lobe-first verified identity brand/AI assets."
config_file = "agents/asset_curator.toml"

[agents.caption_writer]
description = "Adapter for canonical agents/caption-writer.md; craft hook-driven mobile-safe LinkedIn captions and first comments."
config_file = "agents/caption_writer.toml"

[agents.community_publisher]
description = "Adapter for canonical agents/community-publisher.md; manage verified public demo contributions."
config_file = "agents/community_publisher.toml"

[agents.design_study]
description = "Adapter for canonical agents/design-study.md; diagnose visual references and extract 6-axis design DNA."
config_file = "agents/design_study.toml"

[agents.mascot_animator]
description = "Adapter for canonical agents/mascot-animator.md; rig and animate exact SVG mascot characters."
config_file = "agents/mascot_animator.toml"

[agents.masterone]
description = "Adapter for canonical agents/masterone.md; handle first-run onboarding and route selection."
config_file = "agents/masterone.toml"

[agents.motion_engineer]
description = "Adapter for canonical agents/motion-engineer.md; implement seekable CSS/JS infographic animation."
config_file = "agents/motion_engineer.toml"

[agents.palette_curator]
description = "Adapter for canonical agents/palette-curator.md; select restrained Story House color palettes with contrast floors."
config_file = "agents/palette_curator.toml"

[agents.story_architect]
description = "Adapter for canonical agents/story-architect.md; resolve 4-axis Info-story brief and layout structure."
config_file = "agents/story_architect.toml"

[agents.type_curator]
description = "Adapter for canonical agents/type-curator.md; direct intentional, render-safe typography pairings."
config_file = "agents/type_curator.toml"
